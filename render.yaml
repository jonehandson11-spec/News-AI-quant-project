# Render 免费版部署（Blueprint）。云端网页无需访问码；下列环境变量若仍存在会被启动脚本忽略。
services:
  - type: web
    name: news-price-query
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r deploy/requirements.txt
    startCommand: python deploy/cloud_start.py
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: NEWS_PRICE_ACCESS_CODES_JSON
        sync: false
      - key: NEWS_PRICE_SESSION_SECRET
        sync: false
