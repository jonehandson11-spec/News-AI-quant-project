name: Publish news-price query

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/price-query-pages.yml'
      - 'web/**'
      - 'news_price_query/**'
      - 'price_query_tests/**'
      - 'data/news.csv'
      - 'data/public_prices.csv'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-price-query
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test Python query
        run: python -m unittest discover -s price_query_tests -v
      - name: Test browser query
        run: node --test web/core.test.mjs
      - name: Build public site
        run: python web/build_site.py --news data/news.csv --output _site
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publish site
        id: deploy
        uses: actions/deploy-pages@v4
